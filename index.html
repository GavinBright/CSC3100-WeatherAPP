<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black"> 
    <title>My Weather App</title>
    <link rel="apple-touch-icon" sizes="180x180" href="images/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="images/favicon-16x16.png">
    <link rel="manifest" href="site.webmanifest">

    <link href="https://cdn.jsdelivr.net/npm/bootswatch@4.5.2/dist/pulse/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body class="bg-dark">
    <div class="d-flex justify-content-center align-items-center vh-100">
            <div class="card col-12 col-md-7 col-lg-6">
                <h1 class="text-center mb-4 text-primary">Weather Data this Hour</h1>
                <div class="d-flex justify-content-between mb-4">
                    <div class="d-flex flex-column align-items-center mb-2">
                        <i id="temperatureIcon" class="bi bi-thermometer" style="font-size: 3rem;"></i>
                        <h3 id="temperature">Temperature: </h3>
                    </div>
                    <div class="d-flex flex-column align-items-center">
                        <i id="humidityIcon" class="bi bi-droplet" style="font-size: 3rem; color: blue"></i>
                        <h3 id="humidity">Humidity: </h3>
                    </div>
                    <div class="d-flex flex-column align-items-center mb-2">
                        <i id="weatherIcon" class="bi bi-sun-fill" style="font-size: 3rem; color: yellow"></i>
                        <h3 id="weather">Weather: </h3>
                    </div>
                </div>
                <footer>
                    <p>Weather data courtesy of <a href="https://open-meteo.com">Open-Meteo</a></p>
                </footer>
            </div>
        </div>
        
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script>
        function getUserLocation(){
            //Below was an interesting suggestion by ChatGPT that, if I understand it right, should make this sync function work like an async function.
            return new Promise((resolve, reject) => { 
                if (navigator.geolocation){ //If user allows location data.
                    navigator.geolocation.getCurrentPosition( //Get current position.
                        (position) => {
                            const latitude = position.coords.latitude //Assign latitude
                            const longitude = position.coords.longitude //Assign longitude
                            resolve({ latitude, longitude })
                        },
                        (error) => {
                            reject(error)
                        }
                    )
                } else {
                    reject(new Error("Your Browser doesn't support location data."))
                }
            })
        }
        async function getIPLocation() {
        try {
            const response = await fetch('https://ipinfo.io/json?token=22c903e0ca74cf');
            const data = await response.json();
            return { latitude: data.loc.split(',')[0], longitude: data.loc.split(',')[1] };
        } catch (error) {
            throw new Error("Error fetching IP-based location: " + error.message);
        }
}
        async function getWeather(){
            try{
                let location
                try {
                    location = await getUserLocation() //Here is where that ChatGPT suggestion comes into play, it works like an async function.
                } catch(geolocationError){
                    console.log("Geolocation data not allowed, now using IP address.")

                    location = await getIPLocation()
                }

                if(!location){
                    throw new Error("Not able to retrieve location data.")
                }
                const { latitude, longitude } = location 
                const objResponse = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&hourly=temperature_2m,relative_humidity_2m,rain,snowfall,cloud_cover&temperature_unit=fahrenheit&timezone=auto&forecast_days=1`)
                //Note I am using hourly so it is an array of the values throughout the day.
                if(!objResponse.ok){
                    throw new Error(`HTTP Error Status: ${objResponse.status}`)
                }
                const objData = await objResponse.json()

                //Current Weather wasn't working on the API so I used this to display it for the hour.
                const currentTime = new Date()
                const hour = currentTime.getHours()

                const temperatureData = objData.hourly.temperature_2m[hour] 
                const humidityData = objData.hourly.relative_humidity_2m[hour]
                const rainData = objData.hourly.rain[hour]
                const snowData = objData.hourly.snowfall[hour]
                const cloudData = objData.hourly.cloud_cover[hour]
                
                document.getElementById('temperature').textContent = `Temperature: ${temperatureData}°F`
                document.getElementById('humidity').textContent = `Humidity: ${humidityData}%`

                //Below will change the weather part of code, it will change what condition is displayed and the icon.

                //If more rain than snow.
                if(snowData < rainData){ 
                    document.getElementById('weather').textContent = `Weather: ${rainData} inches of rain`
                    if(rainData <= 0.02 && rainData > 0){
                    document.querySelector('#weatherIcon').className = "bi bi-cloud-drizzle"
                    document.querySelector('#weatherIcon').style.color = 'lightskyblue'
                    }
                    else if(rainData > 0.02 && rainData < 0.30){
                        document.querySelector('#weatherIcon').className = "bi bi-cloud-rain"
                    document.querySelector('#weatherIcon').style.color = 'lightskyblue'
                    }
                    else if(rainData >= 0.30){
                        document.querySelector('#weatherIcon').className = "bi bi-cloud-rain-heavy"
                        document.querySelector('#weatherIcon').style.color = 'lightskyblue'
                    }
                }
                //If more snow then rain or same amount.
                else if(snowData >= rainData && snowData != 0){
                    document.getElementById('weather').textContent = `Weather: ${snowData} inches of snow`
                    document.querySelector('#weatherIcon').className = "bi bi-cloud-snow"
                    document.querySelector('#weatherIcon').style.color = 'grey'
                }
                //If partly cloudy.
                else if(cloudData < 75 && cloudData > 25){
                    if(hour >= 6 && hour <= 18){ //If day.
                        document.getElementById('weather').textContent = "Weather: Partly Cloudy"
                        document.querySelector('#weatherIcon').className = "bi bi-cloud-sun-fill"
                        document.querySelector('#weatherIcon').style.color = 'grey'
                    }
                    else{ //If night.
                        document.getElementById('weather').textContent = "Weather: Partly Cloudy"
                        document.querySelector('#weatherIcon').className = "bi bi-cloud-moon-fill"
                        document.querySelector('#weatherIcon').style.color = 'grey'
                    }
                }
                //If very cloudy.
                else if(cloudData >= 75){
                    document.getElementById('weather').textContent = "Weather: Cloudy"
                    document.querySelector('#weatherIcon').className = "bi bi-clouds-fill"
                    document.querySelector('#weatherIcon').style.color = 'grey'
                }
                //If night and not cloudy or rainy.
                else if(hour < 6 || hour > 18){ //If night and not cloudy or rainy.
                    document.getElementById('weather').textContent = "Weather: Clear"
                    document.querySelector('#weatherIcon').className = "bi bi-moon-fill"
                    document.querySelector('#weatherIcon').style.color = 'grey'
                }
                //If no rain, no snow, less than 25% clouds, and not night then it is sunny.
                else{ 
                    if(hour == 6){ //If 6:00AM display a sunrise.
                    document.querySelector('#weatherIcon').className = "bi bi-sunrise-fill"
                    document.querySelector('#weatherIcon').style.color = 'coral'
                    }
                    else if(hour == 18){ //If 6:00PM dispaly a sunset.
                        document.querySelector('#weatherIcon').className = "bi bi-sunset-fill"
                        document.querySelector('#weatherIcon').style.color = 'coral'
                    }
                    document.getElementById('weather').textContent = "Weather: Sunny"
                }
                //This will update the icon for temperature.
                if(temperatureData < 40){ 
                    document.querySelector('#temperatureIcon').className = "bi bi-thermometer-low"
                    document.querySelector('#temperatureIcon').style.color = 'cyan'
                }
                else if(temperatureData >= 40 && temperatureData <= 70){
                    document.querySelector('#temperatureIcon').className = "bi bi-thermometer-half"
                    document.querySelector('#temperatureIcon').style.color = 'orange'
                }
                else if(temperatureData > 70){
                    document.querySelector('#temperatureIcon').className = "bi bi-thermometer-high"
                    document.querySelector('#temperatureIcon').style.color = 'red'
                }

                //This will update the icon for humidity.
                if(humidityData > 25 && humidityData < 75){
                    document.querySelector('#humidityIcon').className = "bi bi-droplet-half"
                    document.querySelector('#humidityIcon').style.color = 'blue'
                }
                else if(humidityData >= 75){
                    document.querySelector('#humidityIcon').className = "bi bi-droplet-fill"
                    document.querySelector('#humidityIcon').style.color = 'blue'
                }
                //Below will change precipitation icon.
                if(snowData > 0 && snowData >= rainData){
                    document.querySelector('#weatherIcon').className = "bi bi-cloud-snow"
                    document.querySelector('#weatherIcon').style.color = 'grey'
                }

            } catch (objError){
                console.log('Error fetching objData', objError)
            }
        }
        getWeather()
    </script>
</body>
</html>
